services:
  - type: web
    name: athena-bot-whatsapp
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Lima
      - key: LOG_LEVEL
        value: info
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: DEFAULT_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: OWNER_NUMBER
        value: 51914443022
      - key: OWNER_LID
        value: 3389215797354
      - key: REPLY_DELAY_MIN
        value: "2"
      - key: REPLY_DELAY_MAX
        value: "6"
      - key: MEMORY_MAX_SHORT_TERM
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false